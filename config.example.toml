# New checkouts are created under <workspace_root>/<repository>/<workspace>.
workspace_root = "~/.herdr/jj-workspaces"

# The create popup starts with this value. Press Tab to change it for one run.
create_bookmark = false

# Herdr submits this command in the new workspace's root pane after creation.
# post_create = "mise install && npm install"

# Used to calculate bookmark distance in the sidebar.
status_remote = "origin"
