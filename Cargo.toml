[package]
name = "herdr-jj"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Jujutsu workspace support for Herdr"
repository = "https://github.com/olivergilan/herdr-jj"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = true
opt-level = "z"
strip = true
